# Q1 / Issue #35: additive, free security analysis for public JS/TS repo.
# Existing Product CI, Repository Contract and manual Windows+WSL smoke remain authoritative.
# No LLM/API keys, external SaaS, repository secrets or generated binaries required.
name: Quality - CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write # Required for CodeQL SARIF upload (only this workflow).

concurrency:
  group: quality-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL - JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # github/codeql-action v4, tag resolved 2026-11-02 to immutable commit.
      # JS/TS uses CodeQL's buildless analysis; no npm install or WSL necessary.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript

      - name: Analyze and upload findings
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:javascript-typescript"

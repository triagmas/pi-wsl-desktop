<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Design Lab capture (Issue #21, D1): Segoe UI из Windows-шрифтов для
  честного Windows-подобного рендера в headless Chromium WSL.
  Подключается через FONTCONFIG_FILE в design-lab/capture.mjs.
  Ограничение: работает только при доступном /mnt/c/Windows/Fonts.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/mnt/c/Windows/Fonts</dir>
  <cachedir>/tmp/design-lab-fontconfig-cache</cachedir>
</fontconfig>
